<rect x="0" y="0" width="1000" height="8" fill="#047857"/><text x="60" y="78" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#13221b" text-anchor="start">국민내일배움카드 지원 구조</text><text x="60" y="116" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#4b5d55" text-anchor="start">5년 유효, 한도 안에서 자부담을 뺀 금액을 지원</text><rect x="60" y="150" width="880" height="382" rx="14" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><path d="M60 164 a14 14 0 0 1 14 -14 h852 a14 14 0 0 1 14 14 v48 h-880 z" fill="#047857"/><text x="80" y="190" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">구분</text><text x="261.17647058823525" y="190" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">금액</text><text x="494.1176470588235" y="190" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">해당하는 사람</text><text x="80" y="253" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#13221b" text-anchor="start">기본 한도</text><text x="261.17647058823525" y="253" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#047857" text-anchor="start">300만원</text><text x="494.1176470588235" y="253" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#13221b" text-anchor="start">발급 제외 대상이 아닌 국민</text><rect x="61" y="276" width="878" height="64" fill="#f3f8f5"/><line x1="60" y1="276" x2="940" y2="276" stroke="#d9e5df"/><text x="80" y="317" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#13221b" text-anchor="start">추가 지원</text><text x="261.17647058823525" y="317" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#047857" text-anchor="start">+200만원</text><text x="494.1176470588235" y="317" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#13221b" text-anchor="start">기간제·파견·단시간·일용근로자, 수급자 등</text><line x1="60" y1="340" x2="940" y2="340" stroke="#d9e5df"/><text x="80" y="381" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#13221b" text-anchor="start">최대 한도</text><text x="261.17647058823525" y="381" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#047857" text-anchor="start">500만원</text><text x="494.1176470588235" y="381" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#13221b" text-anchor="start">추가 지원 대상자만 (계좌 한도 기준)</text><rect x="61" y="404" width="878" height="64" fill="#f3f8f5"/><line x1="60" y1="404" x2="940" y2="404" stroke="#d9e5df"/><text x="80" y="445" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#13221b" text-anchor="start">자부담</text><text x="261.17647058823525" y="445" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#047857" text-anchor="start">훈련비의 0~55%</text><text x="494.1176470588235" y="445" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#13221b" text-anchor="start">통상 15~55%, 특정 계층은 0%·낮은 비율</text><line x1="60" y1="468" x2="940" y2="468" stroke="#d9e5df"/><text x="80" y="509" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#13221b" text-anchor="start">훈련장려금</text><text x="261.17647058823525" y="509" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#047857" text-anchor="start">월 11.6만원(일반)</text><text x="494.1176470588235" y="509" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#13221b" text-anchor="start">140시간 이상 과정, 출석률 80% 이상