<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="778" viewBox="0 0 1000 778" role="img" aria-label="피부양자 자격 판정 순서">
<rect width="1000" height="778" fill="#f7faf8"/>
<rect x="0" y="0" width="1000" height="8" fill="#047857"/><text x="60" y="78" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#13221b" text-anchor="start">피부양자 자격 판정 순서</text><text x="60" y="116" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#4b5d55" text-anchor="start">셋 중 하나라도 넘으면 지역가입자로 전환</text><rect x="60" y="150" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="202" r="28" fill="#047857"/><text x="112" y="212" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="164" y="194" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">관계 요건</text><text x="164" y="230" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">배우자, 직계존·비속과 그 배우자, 형제·자매</text><rect x="850" y="170" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="195" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">부양</text><path d="M112 258 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 276 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="288" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="340" r="28" fill="#047857"/><text x="112" y="350" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="164" y="332" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">합산소득 연 2,000만원 이하</text><text x="164" y="368" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">사업·금융·연금·근로·기타소득 합계, 기혼이면 부부 모두</text><rect x="850" y="308" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="333" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">소득</text><path d="M112 396 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 414 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="426" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="478" r="28" fill="#b45309"/><text x="112" y="488" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="164" y="470" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">사업소득 기준</text><text x="164" y="506" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">등록 사업자는 소득 없어야, 미등록은 500만원 이하</text><rect x="850" y="446" width="70" height="36" rx="18" fill="#fef3c7"/><text x="885" y="471" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">사업</text><path d="M112 534 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 552 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="564" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="616" r="28" fill="#047857"/><text x="112" y="626" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="164" y="608" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">재산세 과표 5.4억원 이하</text><text x="164" y="644" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">5.4억~9억원은 연소득 1,000만원 이하일 때만</text><rect x="850" y="584" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="609" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">재산</text><line x1="60" y1="716" x2="940" y2="716" stroke="#d9e5df" stroke-width="2"/><text x="60" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="start">출처 국민건강보험공단</text><text x="940" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="end">기준일 2026.10.19 · 포켓머니</text>
</svg>
