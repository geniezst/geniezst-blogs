rect x="72" y="274" width="1056" height="119" rx="24" ry="24" fill="#ffffff" stroke="#d97706" stroke-width="3"/></g><circle cx="128" cy="333.5" r="30" fill="url(#wrn)"/><text x="128" y="345.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="182" y="330" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">사업소득 기준</text><text x="182" y="367" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">등록 사업자는 소득 없어야, 미등록은 500만원 이하</text><rect x="1033" y="315.5" width="69" height="36" rx="18" ry="18" fill="#fef3c7" /><text x="1067.5" y="340.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">사업</text><g filter="url(#sh)"><rect x="72" y="411" width="1056" height="119" rx="24" ry="24" fill="#ffffff" /></g><circle cx="128" cy="470.5" r="30" fill="url(#acc)"/><text x="128" y="482.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="182" y="467" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">재산세 과표 5.4억원 이하</text><text x="182" y="504" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">5.4억~9억원은 연소득 1,000만원 이하일 때만</text><rect x="1033" y="452.5" width="69" height="36" rx="18" ry="18" fill="#d1fae5" /><text x="1067.5" y="477.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">재산</text></g>
