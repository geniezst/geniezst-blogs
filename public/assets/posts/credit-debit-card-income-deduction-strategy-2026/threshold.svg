<rect width="1200" height="8" fill="url(#acc)"/>
<circle cx="79" cy="66" r="7" fill="#059669"/><text x="96" y="73" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#059669" text-anchor="start" letter-spacing="0.5">포켓머니</text><text x="72" y="126" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="46" font-weight="800" fill="#0f2a22" text-anchor="start" letter-spacing="-1">카드 소득공제 계산 순서</text><text x="72" y="178" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="25" font-weight="500" fill="#52675f" text-anchor="start">총급여 5,000만원 예시, 2025년 귀속 기준</text>
<g transform="translate(0 248)"><g filter="url(#sh)"><rect x="72" y="0" width="1056" height="119" rx="24" ry="24" fill="#ffffff" stroke="#d97706" stroke-width="3"/></g><circle cx="128" cy="59.5" r="30" fill="url(#wrn)"/><text x="128" y="71.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="182" y="56" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">총급여 25%까지는 공제 없음</text><text x="182" y="93" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">5,000만원 × 25% = 1,250만원, 신용카드분부터 채운 것으로 계산</text><rect x="1033" y="41.5" width="69" height="36" rx="18" ry="18" fill="#fef3c7" /><text x="1067.5" y="66.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">문턱</text><g filter="url(#sh)"><rect x="72" y="137" width="1056" height="119" rx="24" ry="24" fill="#ffffff" /></g><circle cx="128" cy="196.5" r="30" fill="url(#acc)"/><text x="128" y="208.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="182" y="193" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">신용카드 사용분 15%</text><text x="182" y="230" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">문턱 이후 신용카드 사용액</text><rect x="1036" y="178.5" width="66" height="36" rx="18" ry="18" fill="#d1fae5" /><text x="1069" y="203.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">15%</text><g filter="url(#sh)"><rect x="72" y="274" width="1056" height="119" rx="24" ry="24" fill="#ffffff" /></g><circle cx="128" cy="333.5" r="30" fill="url(#acc)"/><text x="128" y="345.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="182" y="330" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">체크카드·현금영수증 30%</text><text x="182" y="367" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">도서·공연·체육시설(2025.7~)도 30%, 총급여 7,000만원 이하</text><rect x="1036" y="315.5" width="66" height="36" rx="18" ry="18" fill="#d1fae5" /><text x="1069" y="340.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">30%</text><g filter="url(#sh)"><rect x="72" y="411" width="1056" height="119" rx="24" ry="24" fill="#ffffff" /></g><circle cx="128" cy="470.5" r="30" fill="url(#acc)"/><text x="128" y="482.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="182" y="467" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">전통시장·대중교통 40%</text><text x="182" y="504" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">추가 한도 300만원(7,000만원 이하)</text><rect x="1036" y="452.5" width="66" height="36" rx="18" ry="18" fill="#d1fae5" /><text x="1069" y="477.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">40%</text><g filter="url(#sh)"><rect x="72" y="548" width="1056" height="119" rx="24" ry="24" fill="#ffffff" /></g><circle cx="128" cy="607.5" r="30" fill="url(#acc)"/><text x="128" y="619.5" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="182" y="604" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="30" font-weight="700" fill="#0f2a22" text-anchor="start" letter-spacing="-0.5">기본 한도 300만원 안에서 공제</text><text x="182" y="641" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="22" font-weight="500" fill="#52675f" text-anchor="start">2026년 사용분부터 자녀 1명당 50만원 추가(최대 100만원)</text><rect x="1033" y="589.5" width="69" height="36" rx="18" ry="18" fill="#d1fae5" /><text x="1067.5" y="614.7" font-family="Pretendard, 'Noto Sans CJK KR', NanumGothic, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">한도</text></g>
