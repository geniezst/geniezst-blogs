<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" aria-label="카드 소득공제 계산 순서">
<rect width="1000" height="916" fill="#f7faf8"/>
<rect x="0" y="0" width="1000" height="8" fill="#047857"/><text x="60" y="78" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#13221b" text-anchor="start">카드 소득공제 계산 순서</text><text x="60" y="116" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#4b5d55" text-anchor="start">총급여 5,000만원 예시, 2025년 귀속 기준</text><rect x="60" y="150" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="202" r="28" fill="#b45309"/><text x="112" y="212" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="164" y="194" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">총급여 25%까지는 공제 없음</text><text x="164" y="230" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">5,000만원 × 25% = 1,250만원, 신용카드분부터 채운 것으로 계산</text><rect x="850" y="170" width="70" height="36" rx="18" fill="#fef3c7"/><text x="885" y="195" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">문턱</text><path d="M112 258 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 276 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="288" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="340" r="28" fill="#047857"/><text x="112" y="350" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="164" y="332" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">신용카드 사용분 15%</text><text x="164" y="368" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">문턱 이후 신용카드 사용액</text><rect x="850.8" y="308" width="69.19999999999999" height="36" rx="18" fill="#d1fae5"/><text x="885.4" y="333" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">15%</text><path d="M112 396 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 414 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="426" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="478" r="28" fill="#047857"/><text x="112" y="488" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="164" y="470" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">체크카드·현금영수증 30%</text><text x="164" y="506" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">도서·공연·체육시설(2025.7~)도 30%, 총급여 7,000만원 이하</text><rect x="850.8" y="446" width="69.19999999999999" height="36" rx="18" fill="#d1fae5"/><text x="885.4" y="471" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">30%</text><path d="M112 534 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 552 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="564" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="616" r="28" fill="#047857"/><text x="112" y="626" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="164" y="608" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">전통시장·대중교통 40%</text><text x="164" y="644" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">추가 한도 300만원(7,000만원 이하)</text><rect x="850.8" y="584" width="69.19999999999999" height="36" rx="18" fill="#d1fae5"/><text x="885.4" y="609" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">40%</text><path d="M112 672 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 690 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="702" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="754" r="28" fill="#047857"/><text x="112" y="764" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="164" y="746" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">기본 한도 300만원 안에서 공제</text><text x="164" y="782" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">2026년 사용분부터 자녀 1명당 50만원 추가(최대 100만원)</text><rect x="850" y="722" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="747" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">한도</text><line x1="60" y1="854" x2="940" y2="854" stroke="#d9e5df" stroke-width="2"/><text x="60" y="888" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="start">출처 국세청·정책브리핑</text><text x="940" y="888" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="end">기준일 2026.10.19 · 포켓머니</text>
</svg>
