<rect x="0" y="0" width="1000" height="8" fill="#047857"/><text x="60" y="78" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#13221b" text-anchor="start">청년월세 지원 자격 확인 순서</text><text x="60" y="116" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#4b5d55" text-anchor="start">2026년 모집 기준, 모든 단계를 충족해야 대상</text><rect x="60" y="150" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="202" r="28" fill="#047857"/><text x="112" y="212" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="164" y="194" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">만 19~34세</text><text x="164" y="230" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">2027년부터 연령 기준 확대 예정(공고 확인)</text><rect x="850" y="170" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="195" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">나이</text><path d="M112 258 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 276 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="288" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="340" r="28" fill="#047857"/><text x="112" y="350" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="164" y="332" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">부모와 따로 사는 무주택 청년</text><text x="164" y="368" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">청약통장 요건은 2026년부터 폐지</text><rect x="850" y="308" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="333" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">거주</text><path d="M112 396 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 414 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="426" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="478" r="28" fill="#047857"/><text x="112" y="488" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="164" y="470" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">청년가구 중위 60% 이하, 재산 1.22억원 이하</text><text x="164" y="506" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">소득인정액 기준</text><rect x="812" y="446" width="108" height="36" rx="18" fill="#d1fae5"/><text x="866" y="471" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">청년가구</text><path d="M112 534 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 552 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="564" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="616" r="28" fill="#b45309"/><text x="112" y="626" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="164" y="608" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">원가구 중위 100% 이하, 재산 4.7억원 이하</text><text x="164" y="644" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">30세 이상·혼인 등은 원가구 미반영 예외</text><rect x="831" y="584" width="89" height="36" rx="18" fill="#fef3c7"/><text x="875.5" y="609" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">원가구</text><line x1="60" y1="716" x2="940" y2="716" stroke="#d9e5df" stroke-width="2"/><text x="60" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="start">출처 국토교통부·복지로</text><text x="940" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="end">기준일 2026.10.19 · 포켓머니</text>
