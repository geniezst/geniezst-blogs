<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="778" viewBox="0 0 1000 778" role="img" aria-label="임차급여 지급액 계산 순서">
<rect width="1000" height="778" fill="#f7faf8"/>
<rect x="0" y="0" width="1000" height="8" fill="#047857"/><text x="60" y="78" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="40" font-weight="700" fill="#13221b" text-anchor="start">임차급여 지급액 계산 순서</text><text x="60" y="116" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="22" font-weight="400" fill="#4b5d55" text-anchor="start">서울 1인, 보증금 500만원·월세 35만원·소득인정액 100만원 예시</text><rect x="60" y="150" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="202" r="28" fill="#047857"/><text x="112" y="212" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="164" y="194" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">실제 임차료 산정</text><text x="164" y="230" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">월세 35만원 + 보증금 500만원 × 4% ÷ 12 ≈ 36만 6,667원</text><rect x="837.6" y="170" width="82.39999999999999" height="36" rx="18" fill="#d1fae5"/><text x="878.8" y="195" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">1단계</text><path d="M112 258 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 276 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="288" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="340" r="28" fill="#047857"/><text x="112" y="350" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="164" y="332" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">기준임대료와 비교</text><text x="164" y="368" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">서울 1인 36만 9천원보다 적으므로 36만 6,667원</text><rect x="837.6" y="308" width="82.39999999999999" height="36" rx="18" fill="#d1fae5"/><text x="878.8" y="333" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">2단계</text><path d="M112 396 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 414 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="426" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="478" r="28" fill="#b45309"/><text x="112" y="488" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="164" y="470" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">자기부담분 차감</text><text x="164" y="506" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">(100만원 − 82만 556원) × 30% ≈ 5만 3,833원</text><rect x="837.6" y="446" width="82.39999999999999" height="36" rx="18" fill="#fef3c7"/><text x="878.8" y="471" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">3단계</text><path d="M112 534 v24" stroke="#9aa8a2" stroke-width="3"/><path d="M104 552 l8 9 l8 -9" fill="none" stroke="#9aa8a2" stroke-width="3"/><rect x="60" y="564" width="880" height="104" rx="16" fill="#ffffff" stroke="#d9e5df" stroke-width="2"/><circle cx="112" cy="616" r="28" fill="#047857"/><text x="112" y="626" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="164" y="608" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#13221b" text-anchor="start">월 지급액</text><text x="164" y="644" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="21" font-weight="400" fill="#4b5d55" text-anchor="start">약 31만 2,800원 (소득·재산 조사로 확정)</text><rect x="850" y="584" width="70" height="36" rx="18" fill="#d1fae5"/><text x="885" y="609" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857" text-anchor="middle">결과</text><line x1="60" y1="716" x2="940" y2="716" stroke="#d9e5df" stroke-width="2"/><text x="60" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="start">출처 국토교통부 마이홈포털</text><text x="940" y="750" font-family="NanumGothic, 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#7a8a83" text-anchor="end">기준일 2026.10.19 · 포켓머니</text>
