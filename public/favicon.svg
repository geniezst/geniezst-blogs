<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="pocke-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="pocket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- M3 핀테크 에메랄드 Squircle 배경 -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#pocke-bg)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />

  <!-- 황금 코인 (Gold Coin with ₩) -->
  <g filter="url(#coin-shadow)">
    <circle cx="64" cy="50" r="32" fill="url(#coin-grad)" stroke="#D97706" stroke-width="2.5" />
    <circle cx="64" cy="50" r="26" fill="none" stroke="#FFE082" stroke-width="1.5" stroke-dasharray="4 2.5" />
    
    <!-- 선명한 원화 ₩ 심볼 (16x16 최적화 굵은 볼드 스트로크) -->
    <path d="M46 41 L53 60 L60 45 L68 45 L75 60 L82 41" fill="none" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="43" y1="50" x2="85" y2="50" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- 포켓 주머니 (Pocket Pouch) -->
  <path d="M26 66 C26 66 42 72 64 72 C86 72 102 66 102 66 C102 66 104 96 93 106 C83 114 45 114 35 106 C24 96 26 66 26 66 Z" fill="url(#pocket-grad)" stroke="#A7F3D0" stroke-width="2.5" />
  <path d="M28 66 C42 72 64 72 100 66" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- 반짝이는 골드 스파클 ✦ -->
  <path d="M98 24 C98 31 100 33 107 33 C100 33 98 35 98 42 C98 35 96 33 89 33 C96 33 98 31 98 24 Z" fill="#FFF59D" />
  <circle cx="24" cy="44" r="2.5" fill="#FFF59D" />
</svg>